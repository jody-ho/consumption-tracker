<!DOCTYPE html>
<html lang="zh-Hant" style="font-size: 18px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 消費獎賞助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .data-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .data-table th { background: #f8fafc; color: #64748b; font-size: 11px; padding: 10px 2px; border-bottom: 2px solid #e2e8f0; text-align: center; }
        .data-table td { padding: 10px 2px; border-bottom: 1px solid #f1f5f9; font-size: 13px; text-align: center; vertical-align: middle; }
        
        .subtotal-row { background-color: #f8fafc; font-weight: bold; color: #475569; }
        .subtotal-row td { border-top: 2px solid #e2e8f0; border-bottom: 1px solid #cbd5e1; }
        .grand-total-row { background-color: #0f172a !important; color: white !important; font-weight: 900; }

        .text-爸爸 { color: #3b82f6; } .active-爸爸 { background: #3b82f6 !important; color: white !important; }
        .text-媽媽 { color: #ec4899; } .active-媽媽 { background: #ec4899 !important; color: white !important; }
        .text-姐姐 { color: #0ea5e9; } .active-姐姐 { background: #0ea5e9 !important; color: white !important; }
        .text-昌哥 { color: #f59e0b; } .active-昌哥 { background: #f59e0b !important; color: white !important; }
        .text-妹妹 { color: #8b5cf6; } .active-妹妹 { background: #8b5cf6 !important; color: white !important; }

        #smartFab { position: fixed !important; right: 20px !important; bottom: 110px !important; width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; z-index: 9999; box-shadow: 0 10px 20px rgba(0,0,0,0.2); border: none; }
        .member-btn { transition: all 0.2s; background: #f1f5f9; border-radius: 12px; font-weight: bold; font-size: 11px; padding: 12px 0; border: 2px solid transparent; }
        .coupon-card { width: calc(33.33% - 6px); background: white; border-radius: 12px; padding: 10px; border: 1px solid #e2e8f0; text-align: center; position: relative; }
        .coupon-card.used { opacity: 0.4; background: #f1f5f9; border-style: dashed; }
    </style>
</head>
<body class="pb-32">

    <div class="max-w-md mx-auto">
        <header class="bg-white sticky top-0 z-50 p-4 shadow-sm flex items-center justify-between border-b">
            <select id="weekDropdown" onchange="changeWeek(this.value)" class="font-black text-slate-800 bg-transparent outline-none flex-1 text-base"></select>
            <button onclick="toggleZoom()" class="bg-slate-100 px-3 py-1.5 rounded-full text-[10px] font-bold text-slate-500">A±</button>
        </header>

        <div id="tab-redeem" class="tab-content active p-4 space-y-4">
            <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <table class="data-table">
                    <thead><tr><th style="width:18%">成員</th><th style="width:25%">平台</th><th style="width:27%">可用券</th><th style="width:30%">需消費</th></tr></thead>
                    <tbody id="redeemTableBody"></tbody>
                    <tfoot id="redeemTableFoot"></tfoot>
                </table>
            </div>
            
            <div class="bg-white rounded-2xl shadow-sm border p-3 mt-6 space-y-3">
                <div class="flex items-start gap-2">
                    <span class="text-[11px] font-black text-slate-400 mt-1 w-8">成員</span>
                    <div class="flex-1 flex flex-wrap gap-1.5" id="filter-members"></div>
                </div>
                <div class="flex items-start gap-2">
                    <span class="text-[11px] font-black text-slate-400 mt-1 w-8">平台</span>
                    <div class="flex-1 flex flex-wrap gap-1.5" id="filter-platforms"></div>
                </div>
                <div class="flex items-center gap-2 pt-2 border-t border-slate-50">
                     <span class="text-[11px] font-black text-slate-400 w-8">狀態</span>
                     <select id="filterStatus" onchange="renderList()" class="text-xs bg-slate-50 border border-slate-200 px-2 py-1 rounded-lg outline-none font-bold text-slate-600 flex-1">
                         <option value="All">顯示全部狀態</option>
                         <option value="Available">僅顯示可用券</option>
                         <option value="Used">僅顯示已核銷</option>
                     </select>
                </div>
            </div>
            
            <div id="individualList" class="flex flex-col gap-6 pb-20 mt-2"></div>
            <button id="smartFab" onclick="toggleCalc(true)" class="bg-rose-600 text-white">🛒</button>
        </div>

        <div id="tab-input" class="tab-content p-4 space-y-6">
            <div class="bg-white rounded-3xl p-5 shadow-sm border space-y-4">
                <div class="grid grid-cols-5 gap-1.5" id="memberSelector">
                    <button onclick="selectUser('爸爸')" id="btn-爸爸" class="member-btn">爸爸</button>
                    <button onclick="selectUser('媽媽')" id="btn-媽媽" class="member-btn">媽媽</button>
                    <button onclick="selectUser('姐姐')" id="btn-姐姐" class="member-btn">姐姐</button>
                    <button onclick="selectUser('昌哥')" id="btn-昌哥" class="member-btn">昌哥</button>
                    <button onclick="selectUser('妹妹')" id="btn-妹妹" class="member-btn">妹妹</button>
                </div>
                <select id="platformSelect" class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 font-black outline-none">
                    <option>MPay</option><option>中銀</option><option>工銀</option><option>大豐</option><option>國際</option><option>支付寶</option><option>UEPay</option>
                </select>
                <div class="flex gap-3 py-2">
                    <div id="slot-0" onclick="activeSlot=0; updateSlotUI()" class="flex-1 py-6 border-2 rounded-2xl text-center font-black text-2xl bg-white" data-touched="false">0</div>
                    <div id="slot-1" onclick="activeSlot=1; updateSlotUI()" class="flex-1 py-6 border-2 rounded-2xl text-center font-black text-2xl bg-white" data-touched="false">0</div>
                    <div id="slot-2" onclick="activeSlot=2; updateSlotUI()" class="flex-1 py-6 border-2 rounded-2xl text-center font-black text-2xl bg-white" data-touched="false">0</div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="setSlotValue(10)" class="bg-white border py-4 rounded-xl font-black">10</button>
                    <button onclick="setSlotValue(20)" class="bg-white border py-4 rounded-xl font-black">20</button>
                    <button onclick="setSlotValue(50)" class="bg-white border py-4 rounded-xl font-black">50</button>
                    <button onclick="setSlotValue(100)" class="bg-amber-50 text-amber-600 border py-4 rounded-xl font-black">100</button>
                    <button onclick="setSlotValue(200)" class="bg-rose-50 text-rose-600 border py-4 rounded-xl font-black">200</button>
                    <button onclick="setSlotValue(0)" class="bg-slate-800 text-white py-4 rounded-xl font-black text-xs">謝謝參與</button>
                </div>
                <button onclick="submitBatch()" class="w-full bg-slate-800 text-white py-5 rounded-2xl font-black text-lg shadow-lg">📥 登記獎賞</button>
            </div>
        </div>

        <div id="tab-stat" class="tab-content p-4 space-y-4">
            <div class="flex justify-between items-end px-1">
                <h3 class="font-black text-slate-800 text-lg">📊 財務報表</h3>
                <select id="statMode" onchange="updateStatsUI()" class="text-xs bg-white border border-slate-200 px-2 py-1 rounded-lg outline-none font-bold">
                    <option value="week">本週</option><option value="all">全期</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-2">
                <div class="bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200 rounded-2xl p-4 shadow-sm flex flex-col items-center justify-center">
                    <div class="text-[10px] font-black text-amber-600 mb-1">🏆 手氣王</div>
                    <div class="text-2xl font-black text-slate-800" id="rank-member-name">-</div>
                    <div class="text-xs font-bold text-slate-500 mt-1">累計 <span class="text-amber-600 font-mono" id="rank-member-val">0</span> 元</div>
                </div>
                <div class="bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 rounded-2xl p-4 shadow-sm flex flex-col items-center justify-center">
                    <div class="text-[10px] font-black text-blue-600 mb-1">👑 最強平台</div>
                    <div class="text-2xl font-black text-slate-800" id="rank-platform-name">-</div>
                    <div class="text-xs font-bold text-slate-500 mt-1">派發 <span class="text-blue-600 font-mono" id="rank-platform-val">0</span> 元</div>
                </div>
            </div>

            <section class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <table class="data-table">
                    <thead>
                        <tr><th style="width:14%">成員</th><th style="width:24%">平台</th><th style="width:20%">已用</th><th style="width:20%">剩餘</th><th style="width:22%">實付</th></tr>
                    </thead>
                    <tbody id="memberTableBody"></tbody>
                    <tfoot id="tableGrandTotal"></tfoot>
                </table>
            </section>
        </div>

        <nav class="fixed bottom-0 left-0 right-0 h-24 bg-white border-t flex justify-around items-center z-[9000] shadow-2xl">
            <button onclick="switchTab('redeem')" id="nav-redeem" class="flex-1 flex flex-col items-center font-bold text-sm text-rose-600"><span class="text-2xl mb-1">🛒</span>使用</button>
            <button onclick="switchTab('input')" id="nav-input" class="flex-1 flex flex-col items-center font-bold text-sm text-slate-400"><span class="text-2xl mb-1">📥</span>登記</button>
            <button onclick="switchTab('stat')" id="nav-stat" class="flex-1 flex flex-col items-center font-bold text-sm text-slate-400"><span class="text-2xl mb-1">📊</span>帳目</button>
        </nav>
    </div>

    <div id="calculatorModal" onclick="if(event.target===this) toggleCalc(false)" class="hidden fixed inset-0 bg-black/80 z-[10000] items-center justify-center p-6">
        <div class="bg-slate-900 w-full max-w-sm rounded-[40px] p-8 space-y-6" onclick="event.stopPropagation()">
            <h3 class="text-white font-black text-xl text-center">智能湊券助手</h3>
            <p class="text-rose-400 text-[10px] text-center -mt-4">⚠️ 將根據你在外層勾選的「成員與平台」進行篩選分配</p>
            <input type="number" id="billAmount" oninput="runSmartMatch()" placeholder="輸入消費金額..." class="w-full bg-slate-800 border-none rounded-3xl py-6 text-4xl font-black text-rose-400 text-center outline-none">
            <div id="smartResult" class="hidden space-y-4">
                <div id="smartPlanList" class="space-y-2 max-h-48 overflow-y-auto no-scrollbar"></div>
                <button onclick="applySmartRedeem()" class="w-full bg-rose-600 py-4 rounded-2xl font-black text-white shadow-lg">確認使用這些券</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCJY3vzA7xuC-bC6PLGk5wGAe_rjPMP4w4", authDomain: "testing-a7aba.firebaseapp.com", projectId: "testing-a7aba", databaseURL: "https://testing-a7aba-default-rtdb.firebaseio.com/", appId: "1:94291975544:web:1fc1e0aff39d8fd0357c8d" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const MEMBERS = ['爸爸', '媽媽', '姐姐', '昌哥', '妹妹'];
        const PLATFORMS = ['MPay', '中銀', '工銀', '大豐', '國際', '支付寶', 'UEPay'];
        const WEEK_DATA = [];
        const START_DATE = new Date('2026-04-10');
        for(let i=0; i<10; i++){ 
            let s = new Date(START_DATE); s.setDate(s.getDate() + i*7); 
            let e = new Date(s); e.setDate(e.getDate() + 6); 
            WEEK_DATA.push({ id:i+1, key:`2026-W${i+1}`, start:s, end:e, range:`${s.getMonth()+1}/${s.getDate()}-${e.getMonth()+1}/${e.getDate()}` }); 
        }
        
        let currentWeekKey = WEEK_DATA[0].key;
        let currentUser = '爸爸';
        let activeSlot = 0;
        let slotValues = [0,0,0];
        let allCoupons = {};

        // 多選狀態
        let activeFMem = [...MEMBERS];
        let activeFPlat = [...PLATFORMS];

        function renderFilters() {
            let mHtml = '';
            MEMBERS.forEach(m => {
                const isActive = activeFMem.includes(m);
                mHtml += `<button onclick="toggleFMem('${m}')" class="px-2 py-1 rounded-md text-[11px] font-bold border transition-all ${isActive ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-400 border-slate-200'}">${m}</button>`;
            });
            document.getElementById('filter-members').innerHTML = mHtml;

            let pHtml = '';
            PLATFORMS.forEach(p => {
                const isActive = activeFPlat.includes(p);
                pHtml += `<button onclick="toggleFPlat('${p}')" class="px-2 py-1 rounded-md text-[11px] font-bold border transition-all ${isActive ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-400 border-slate-200'}">${p}</button>`;
            });
            document.getElementById('filter-platforms').innerHTML = pHtml;
        }

        function toggleFMem(m) {
            if(activeFMem.includes(m)) activeFMem = activeFMem.filter(x => x!==m);
            else activeFMem.push(m);
            renderFilters(); renderList();
        }
        function toggleFPlat(p) {
            if(activeFPlat.includes(p)) activeFPlat = activeFPlat.filter(x => x!==p);
            else activeFPlat.push(p);
            renderFilters(); renderList();
        }

        function quickRedeem(member, payment) {
            const wkData = allCoupons[currentWeekKey] || {};
            const targets = Object.keys(wkData).filter(id => {
                const c = wkData[id];
                const m = (c.member === '家姐' || c.member === '姐') ? '姐姐' : c.member;
                return m === member && c.payment === payment && c.amount > 0;
            });
            if(targets.length === 0) return;
            const hasUnused = targets.some(id => !wkData[id].used);
            const updates = {};
            targets.forEach(id => {
                if (hasUnused) {
                    if (!wkData[id].used) {
                        updates[`coupons/${currentWeekKey}/${id}/used`] = true;
                        updates[`coupons/${currentWeekKey}/${id}/realPayPart`] = wkData[id].amount * 2;
                    }
                } else {
                    updates[`coupons/${currentWeekKey}/${id}/used`] = false;
                    updates[`coupons/${currentWeekKey}/${id}/realPayPart`] = 0;
                }
            });
            if(Object.keys(updates).length > 0) db.ref().update(updates);
        }

        function updateSummaryTable() {
            const wkData = allCoupons[currentWeekKey] || {};
            const res = {}; MEMBERS.forEach(m => res[m] = { platforms: {} });
            let grandRem = 0;

            Object.values(wkData).forEach(c => {
                const m = (c.member === '家姐' || c.member === '姐') ? '姐姐' : c.member;
                if(!res[m]) return;
                if(!res[m].platforms[c.payment]) res[m].platforms[c.payment] = { rem: 0, used: 0, zero: 0 };
                if(c.amount === 0) res[m].platforms[c.payment].zero++;
                else if(c.used) res[m].platforms[c.payment].used += c.amount;
                else { res[m].platforms[c.payment].rem += c.amount; grandRem += c.amount; }
            });

            let bodyHtml = "";
            MEMBERS.forEach(m => {
                const pKeys = Object.keys(res[m].platforms); if(pKeys.length === 0) return;
                let mRem = 0;
                pKeys.forEach((p, idx) => {
                    const d = res[m].platforms[p]; mRem += d.rem;
                    let amountHtml = `<div class="font-bold">${d.rem > 0 ? d.rem : '-'}</div>`;
                    if(d.zero > 0) amountHtml += `<div class="text-[10px] text-slate-400 leading-none mt-0.5">謝謝×${d.zero}</div>`;

                    bodyHtml += `<tr onclick="quickRedeem('${m}','${p}')" class="cursor-pointer active:bg-slate-50 transition-colors">` +
                                `${idx === 0 ? `<td rowspan="${pKeys.length+1}" class="font-bold text-${m} border-r">${m}</td>` : ''}` +
                                `<td class="text-slate-500 border-r">${p}</td>` +
                                `<td>${amountHtml}</td>` +
                                `<td class="font-mono text-slate-400">${d.rem > 0 ? d.rem*3 : ''}</td>` +
                                `</tr>`;
                });
                bodyHtml += `<tr class="subtotal-row">` +
                            `<td class="text-right px-2 text-[10px] text-slate-400 border-r">小計</td>` + 
                            `<td>${mRem}</td>` + 
                            `<td class="font-mono">${mRem*3}</td>` + 
                            `</tr>`;
            });
            document.getElementById('redeemTableBody').innerHTML = bodyHtml || '<tr><td colspan="4" class="py-10 text-slate-400">無數據</td></tr>';
            document.getElementById('redeemTableFoot').innerHTML = grandRem > 0 ? `<tr class="grand-total-row"><td colspan="2">總計</td><td>${grandRem}</td><td class="font-mono text-emerald-400">${grandRem*3}</td></tr>` : '';

            renderList(); 
        }

        function renderList() {
            const wkData = allCoupons[currentWeekKey] || {};
            const fStat = document.getElementById('filterStatus').value;

            let listHtml = ""; const groups = {};
            
            Object.keys(wkData).forEach(id => {
                const c = wkData[id]; 
                const m = (c.member === '家姐' || c.member === '姐') ? '姐姐' : c.member;
                
                if (!activeFMem.includes(m)) return;
                if (!activeFPlat.includes(c.payment)) return;
                if (fStat === 'Available' && c.used) return;
                if (fStat === 'Used' && !c.used) return;

                const key = `${m}-${c.payment}`;
                if(!groups[key]) groups[key] = { m, p: c.payment, items: [] };
                groups[key].items.push({ id, ...c });
            });

            const groupKeys = Object.values(groups);
            if (groupKeys.length === 0) {
                document.getElementById('individualList').innerHTML = '<div class="text-center text-slate-400 py-6 text-sm">無符合條件的獎賞</div>';
                return;
            }

            groupKeys.forEach(g => {
                listHtml += `<div class="space-y-3"><div class="flex items-center gap-2 px-1"><span class="w-1.5 h-4 bg-${g.m} rounded-full"></span><span class="font-black text-sm text-slate-700">${g.m} · ${g.p}</span></div><div class="flex flex-wrap gap-2">`;
                g.items.sort((a,b)=>b.amount-a.amount).forEach(c => {
                    const isZero = (c.amount === 0);
                    listHtml += `<div class="coupon-card ${c.used?'used':''}"><div class="${isZero?'text-[10px]':'text-xl'} font-black text-slate-800">${isZero?'謝謝參與':c.amount}</div><div class="flex gap-1 mt-2">${isZero ? `<button onclick="deleteCoupon('${c.id}')" class="w-full text-rose-400 font-bold text-[10px] bg-slate-50 py-1 rounded">刪除</button>` : `<button onclick="toggleCoupon('${c.id}')" class="flex-1 py-1 bg-slate-100 rounded text-[10px] font-bold">${c.used?'還原':'核銷'}</button><button onclick="deleteCoupon('${c.id}')" class="px-1 text-rose-300">✕</button>`}</div></div>`;
                });
                listHtml += `</div></div>`;
            });
            document.getElementById('individualList').innerHTML = listHtml;
        }

        function updateStatsUI() {
            const mode = document.getElementById('statMode').value;
            const res = {}; MEMBERS.forEach(m => res[m] = { platforms: {} });
            
            const memberTotals = {}; MEMBERS.forEach(m => memberTotals[m] = 0);
            const platformTotals = {}; PLATFORMS.forEach(p => platformTotals[p] = 0);
            
            Object.keys(allCoupons).forEach(wk => {
                if (!wk.startsWith('2026-W')) return;
                if (mode === 'week' && wk !== currentWeekKey) return;
                
                Object.values(allCoupons[wk]).forEach(c => {
                    const m = (c.member === '家姐' || c.member === '姐') ? '姐姐' : c.member;
                    if (!res[m]) return;
                    
                    if(c.amount > 0) { 
                        // 計算排行榜總額
                        if(memberTotals[m] !== undefined) memberTotals[m] += c.amount;
                        if(platformTotals[c.payment] !== undefined) platformTotals[c.payment] += c.amount;

                        if (!res[m].platforms[c.payment]) res[m].platforms[c.payment] = {用:0, 剩:0, 實:0};
                        const d = res[m].platforms[c.payment];
                        if(c.used) { d.用 += c.amount; d.實 += parseFloat(c.realPayPart || (c.amount*2)); } 
                        else { d.剩 += c.amount; } 
                    }
                });
            });

            // 更新排行榜 UI
            let topM = '-', topMVal = 0;
            MEMBERS.forEach(m => { if(memberTotals[m] > topMVal) { topM = m; topMVal = memberTotals[m]; } });
            let topP = '-', topPVal = 0;
            PLATFORMS.forEach(p => { if(platformTotals[p] > topPVal) { topP = p; topPVal = platformTotals[p]; } });

            document.getElementById('rank-member-name').innerText = topMVal > 0 ? topM : '-';
            document.getElementById('rank-member-val').innerText = topMVal;
            document.getElementById('rank-platform-name').innerText = topPVal > 0 ? topP : '-';
            document.getElementById('rank-platform-val').innerText = topPVal;

            let h = ""; let gU=0, gR=0, gP=0;
            MEMBERS.forEach(m => {
                const pKeys = Object.keys(res[m].platforms); if(!pKeys.length) return;
                let mu=0, mr=0, mp=0;
                pKeys.forEach((p, i) => {
                    const d = res[m].platforms[p]; mu+=d.用; mr+=d.剩; mp+=d.實;
                    h += `<tr>` +
                         `${i===0?`<td rowspan="${pKeys.length+1}" class="text-${m} font-bold border-r">${m}</td>`:''}` +
                         `<td class="text-[11px] border-r text-slate-500">${p}</td>` +
                         `<td class="text-slate-400 font-mono">${d.用}</td>` +
                         `<td class="font-bold font-mono">${d.剩}</td>` +
                         `<td class="text-emerald-600 font-bold font-mono">${Math.round(d.實)}</td>` +
                         `</tr>`;
                });
                h += `<tr class="subtotal-row">` +
                     `<td class="text-right px-2 text-[10px] text-slate-400 border-r">小計</td>` + 
                     `<td class="font-mono">${mu}</td>` + 
                     `<td class="font-mono">${mr}</td>` + 
                     `<td class="text-emerald-700 font-mono">${Math.round(mp)}</td>` + 
                     `</tr>`;
                gU+=mu; gR+=mr; gP+=mp;
            });
            document.getElementById('memberTableBody').innerHTML = h || '<tr><td colspan="5" class="py-10 text-slate-400 text-center">查無活動數據</td></tr>';
            document.getElementById('tableGrandTotal').innerHTML = `<tr class="grand-total-row"><td colspan="2">總計</td><td class="font-mono">${gU}</td><td class="font-mono">${gR}</td><td class="text-emerald-400 text-lg font-black font-mono">${Math.round(gP)}</td></tr>`;
        }

        // --- 基礎操作區 ---
        function selectUser(name) { currentUser = name; document.querySelectorAll('.member-btn').forEach(b => { b.className = 'member-btn'; if(b.id === 'btn-'+name) b.classList.add('active-'+name); }); }
        function setSlotValue(v) { slotValues[activeSlot] = v; document.getElementById(`slot-${activeSlot}`).setAttribute('data-touched', 'true'); activeSlot = (activeSlot + 1) % 3; updateSlotUI(); }
        function updateSlotUI() { slotValues.forEach((v, i) => { const el = document.getElementById(`slot-${i}`); const t = el.getAttribute('data-touched')==='true'; el.innerText = (t && v===0)?'謝謝':v; el.className = `flex-1 py-6 border-2 rounded-2xl text-center font-black text-2xl transition-all ${t ? 'border-slate-800 bg-white' : 'border-slate-200 bg-slate-50 text-slate-300'} ${i===activeSlot?'border-rose-500 scale-105 shadow-md':''}`; }); }
        function submitBatch() { 
            const p = document.getElementById('platformSelect').value; let count = 0;
            slotValues.forEach((v, i) => { if(document.getElementById(`slot-${i}`).getAttribute('data-touched')==='true') { db.ref(`coupons/${currentWeekKey}/${Date.now()+i}`).set({ amount:v, member:currentUser, payment:p, used:false }); count++; }}); 
            if(count>0) { slotValues=[0,0,0]; activeSlot=0; [0,1,2].forEach(i => document.getElementById(`slot-${i}`).setAttribute('data-touched', 'false')); updateSlotUI(); }
        }
        function switchTab(t) { 
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); 
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-rose-600', 'text-slate-400')); 
            document.getElementById('tab-'+t).classList.add('active'); 
            document.getElementById('nav-'+t).classList.replace('text-slate-400', 'text-rose-600'); 
            if(t==='stat') updateStatsUI(); 
            document.getElementById('smartFab').style.display = (t === 'redeem') ? 'flex' : 'none';
        }
        function changeWeek(v) { currentWeekKey = v; updateSummaryTable(); updateStatsUI(); }
        function deleteCoupon(id) { if(confirm('確定刪除？')) db.ref(`coupons/${currentWeekKey}/${id}`).remove(); }
        function toggleCoupon(id) { const c = allCoupons[currentWeekKey][id]; if(c.amount === 0) return; const ns = !c.used; db.ref(`coupons/${currentWeekKey}/${id}`).update({ used: ns, realPayPart: ns ? (c.amount*2) : 0 }); }
        function toggleCalc(s) { document.getElementById('calculatorModal').classList.toggle('hidden', !s); if(s) { document.getElementById('billAmount').value=''; document.getElementById('smartResult').classList.add('hidden'); } }
        function toggleZoom() { document.documentElement.style.fontSize = document.documentElement.style.fontSize === '22px' ? '18px' : '22px'; }
        
        function runSmartMatch() {
            const bill = parseFloat(document.getElementById('billAmount').value) || 0;
            const resArea = document.getElementById('smartResult');
            if(bill <= 0) { resArea.classList.add('hidden'); return; }
            resArea.classList.remove('hidden');
            const av = []; 
            Object.values(allCoupons[currentWeekKey] || {}).forEach(c => { 
                const m = (c.member === '家姐' || c.member === '姐') ? '姐姐' : c.member; 
                if(!c.used && c.amount > 0 && activeFMem.includes(m) && activeFPlat.includes(c.payment)) {
                    av.push({...c, m}); 
                }
            });
            av.sort((a,b)=>b.amount-a.amount);
            let rem = bill, html = ""; window.tempMatched = [];
            for(let c of av) { if(rem >= c.amount*3) { rem -= c.amount*3; html += `<div class="text-white text-xs bg-white/10 p-3 rounded-xl flex justify-between"><span>${c.m} · ${c.payment}</span><span class="font-bold text-rose-400">-${c.amount}</span></div>`; window.tempMatched.push(c); } }
            document.getElementById('smartPlanList').innerHTML = html || '<div class="text-slate-500 text-center py-4">無符合篩選的可用方案</div>';
        }
        
        function applySmartRedeem() {
            if(!window.tempMatched?.length) return;
            const bill = parseFloat(document.getElementById('billAmount').value);
            const totalC = window.tempMatched.reduce((a,b)=>a+b.amount,0);
            window.tempMatched.forEach(t => db.ref(`coupons/${currentWeekKey}/${t.id}`).update({ used:true, realPayPart: (t.amount/totalC)*(bill-totalC) }));
            toggleCalc(false);
        }

        db.ref('coupons').on('value', s => { allCoupons = s.val() || {}; updateSummaryTable(); updateStatsUI(); });
        window.onload = () => { 
            const drp = document.getElementById('weekDropdown'); 
            WEEK_DATA.forEach(w => { const o = document.createElement('option'); o.value = w.key; o.textContent = `2026 第 ${w.id} 週 (${w.range})`; drp.appendChild(o); }); 
            const now = new Date(); const found = WEEK_DATA.find(w => now >= w.start && now <= w.end);
            if (found) { currentWeekKey = found.key; drp.value = found.key; }
            selectUser('爸爸'); updateSlotUI(); renderFilters();
        };
    </script>
</body>
</html>
