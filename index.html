<!DOCTYPE html>
<html lang="zh-Hant" style="font-size: 18px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 消費獎賞助手 V3.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* 成員按鈕樣式 */
        .member-btn { transition: all 0.2s; border: 2px solid transparent; }
        .member-btn.active-爸爸 { background-color: #3b82f6 !important; color: white !important; border-color: #2563eb; }
        .member-btn.active-媽媽 { background-color: #ec4899 !important; color: white !important; border-color: #db2777; }
        .member-btn.active-姐姐 { background-color: #0ea5e9 !important; color: white !important; border-color: #0284c7; }
        .member-btn.active-昌哥 { background-color: #f59e0b !important; color: white !important; border-color: #d97706; }
        .member-btn.active-妹妹 { background-color: #8b5cf6 !important; color: white !important; border-color: #7c3aed; }
        
        .data-table { width: 100% !important; border-collapse: collapse; background: white; table-layout: fixed; }
        .data-table th { background: #f8fafc; color: #64748b; font-size: 13px; padding: 12px 2px; border-bottom: 2px solid #e2e8f0; text-align: center; }
        .data-table td { padding: 12px 2px; border-bottom: 1px solid #f1f5f9; font-size: 15px; text-align: center; vertical-align: middle; }
        
        .subtotal-row { background-color: #f8fafc; font-weight: bold; }
        .grand-total-row { background-color: #0f172a !important; color: white !important; font-weight: 900; }

        .text-爸爸 { color: #3b82f6; } .bg-爸爸 { background-color: #3b82f6; }
        .text-媽媽 { color: #ec4899; } .bg-媽媽 { background-color: #ec4899; }
        .text-姐姐 { color: #0ea5e9; } .bg-姐姐 { background-color: #0ea5e9; }
        .text-昌哥 { color: #f59e0b; } .bg-昌哥 { background-color: #f59e0b; }
        .text-妹妹 { color: #8b5cf6; } .bg-妹妹 { background-color: #8b5cf6; }

        .filter-chip { flex: 0 0 auto; padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: bold; border: 1.5px solid #e2e8f0; color: #64748b; background: white; }
        .filter-chip.active { background: #0f172a !important; color: white !important; border-color: #0f172a !important; }

        .coupon-group-box { display: flex; flex-wrap: wrap; gap: 8px; }
        .coupon-card { width: calc(33.33% - 6px); background: white; border-radius: 16px; padding: 12px; border: 1px solid #e2e8f0; }
        .coupon-card.used { background: #f8fafc; opacity: 0.5; border-style: dashed; }
        .coupon-card.zero { border-color: #cbd5e1; background: #f8fafc; }

        #smartFab { position: fixed; right: 20px; bottom: 120px; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); z-index: 100; border:none; }
        #calculatorModal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.8); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32">

    <div class="max-w-md mx-auto">
        <header class="bg-white sticky top-0 z-50 p-4 shadow-sm flex items-center justify-between border-b">
            <select id="weekDropdown" onchange="changeWeek(this.value)" class="font-black text-slate-800 bg-transparent outline-none flex-1 text-base"></select>
            <button onclick="toggleZoom()" class="bg-slate-100 px-3 py-1.5 rounded-full text-[10px] font-bold text-slate-500">A±</button>
        </header>

        <div id="tab-redeem" class="tab-content active p-4 space-y-4">
            <section class="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden">
                <table class="data-table">
                    <thead><tr><th style="width:18%">成員</th><th style="width:25%">平台</th><th style="width:27%">面額</th><th style="width:30%">需消費</th></tr></thead>
                    <tbody id="redeemTableBody"></tbody>
                    <tfoot id="redeemTableFoot"></tfoot>
                </table>
            </section>

            <div class="sticky top-[68px] bg-slate-50/90 backdrop-blur-md z-40 py-3 space-y-3 -mx-4 px-4 border-b border-slate-200">
                <div class="flex gap-2 overflow-x-auto no-scrollbar" id="memberFilter">
                    <button onclick="toggleFilter('member', '爸爸')" class="filter-chip" data-val="爸爸">爸爸</button>
                    <button onclick="toggleFilter('member', '媽媽')" class="filter-chip" data-val="媽媽">媽媽</button>
                    <button onclick="toggleFilter('member', '姐姐')" class="filter-chip" data-val="姐姐">姐姐</button>
                    <button onclick="toggleFilter('member', '昌哥')" class="filter-chip" data-val="昌哥">昌哥</button>
                    <button onclick="toggleFilter('member', '妹妹')" class="filter-chip" data-val="妹妹">妹妹</button>
                </div>
                <div class="flex gap-2 overflow-x-auto no-scrollbar" id="platformFilter"></div>
            </div>
            <div id="individualList" class="flex flex-col gap-6 pb-20"></div>
            <button id="smartFab" onclick="toggleCalc(true)" class="bg-rose-600 text-white">🛒</button>
        </div>

        <div id="tab-input" class="tab-content p-4 space-y-6">
            <div class="bg-white rounded-3xl p-5 shadow-sm border space-y-4">
                <p class="text-xs font-bold text-slate-400 px-1">選擇成員：</p>
                <div class="grid grid-cols-5 gap-1.5">
                    <button onclick="selectUser('爸爸')" id="btn-爸爸" class="member-btn py-3 rounded-xl font-bold text-[11px] bg-slate-100">爸爸</button>
                    <button onclick="selectUser('媽媽')" id="btn-媽媽" class="member-btn py-3 rounded-xl font-bold text-[11px] bg-slate-100">媽媽</button>
                    <button onclick="selectUser('姐姐')" id="btn-姐姐" class="member-btn py-3 rounded-xl font-bold text-[11px] bg-slate-100">姐姐</button>
                    <button onclick="selectUser('昌哥')" id="btn-昌哥" class="member-btn py-3 rounded-xl font-bold text-[11px] bg-slate-100">昌哥</button>
                    <button onclick="selectUser('妹妹')" id="btn-妹妹" class="member-btn py-3 rounded-xl font-bold text-[11px] bg-slate-100">妹妹</button>
                </div>
                
                <p class="text-xs font-bold text-slate-400 px-1 mt-4">選擇平台：</p>
                <select id="platformSelect" class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 font-black outline-none">
                    <option>MPay</option><option>中銀</option><option>工銀</option><option>大豐</option><option>國際</option><option>支付寶</option><option>UEPay</option>
                </select>

                <div class="flex gap-3 py-2">
                    <div id="slot-0" onclick="activeSlot=0; updateSlotUI()" class="flex-1 py-6 border-2 rounded-2xl text-center font-black text-2xl bg-white" data-touched="false">0</div>
                    <div id="slot-1" onclick="activeSlot=1; updateSlotUI()" class="flex-1 py-6 border-2 rounded-2xl text-center font-black text-2xl bg-white" data-touched="false">0</div>
                    <div id="slot-2" onclick="activeSlot=2; updateSlotUI()" class="flex-1 py-6 border-2 rounded-2xl text-center font-black text-2xl bg-white" data-touched="false">0</div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <button onclick="setSlotValue(10)" class="bg-white border py-4 rounded-2xl font-black">10</button>
                    <button onclick="setSlotValue(20)" class="bg-white border py-4 rounded-2xl font-black">20</button>
                    <button onclick="setSlotValue(50)" class="bg-white border py-4 rounded-2xl font-black">50</button>
                    <button onclick="setSlotValue(100)" class="bg-amber-50 text-amber-600 border py-4 rounded-2xl font-black">100</button>
                    <button onclick="setSlotValue(200)" class="bg-rose-50 text-rose-600 border py-4 rounded-2xl font-black">200</button>
                    <button onclick="setSlotValue(0)" class="bg-slate-800 text-white py-4 rounded-2xl font-black text-sm">謝謝參與</button>
                </div>
                <button onclick="submitBatch()" id="submitBtn" class="w-full bg-slate-800 text-white py-5 rounded-2xl font-black text-lg shadow-lg">📥 登記獎賞</button>
            </div>
        </div>

        <div id="tab-stat" class="tab-content p-4 space-y-4">
            <div class="flex justify-between items-center px-1">
                <h3 class="font-black text-slate-800">📊 財務報表</h3>
                <select id="statMode" onchange="updateStatsUI()" class="text-xs bg-white border px-2 py-1 rounded-lg">
                    <option value="week">本週</option><option value="all">全期</option>
                </select>
            </div>
            <section class="bg-white rounded-3xl shadow-sm border overflow-hidden">
                <table class="data-table">
                    <thead>
                        <tr><th style="width:20%">成員</th><th style="width:30%">平台</th><th style="width:25%">用/剩</th><th style="width:25%">實付</th></tr>
                    </thead>
                    <tbody id="memberTableBody"></tbody>
                    <tfoot id="tableGrandTotal"></tfoot>
                </table>
            </section>
        </div>

        <nav class="fixed bottom-0 left-0 right-0 h-24 bg-white border-t flex justify-around items-center z-50 shadow-2xl">
            <button onclick="switchTab('redeem')" id="nav-redeem" class="flex-1 flex flex-col items-center font-bold text-sm text-rose-600"><span class="text-2xl mb-1">🛒</span>使用</button>
            <button onclick="switchTab('input')" id="nav-input" class="flex-1 flex flex-col items-center font-bold text-sm text-slate-400"><span class="text-2xl mb-1">📥</span>登記</button>
            <button onclick="switchTab('stat')" id="nav-stat" class="flex-1 flex flex-col items-center font-bold text-sm text-slate-400"><span class="text-2xl mb-1">📊</span>帳目</button>
        </nav>
    </div>

    <div id="calculatorModal" onclick="if(event.target===this) toggleCalc(false)" class="hidden fixed inset-0 bg-black/80 z-[200] items-center justify-center p-6">
        <div class="bg-slate-900 w-full max-w-sm rounded-[40px] p-8 space-y-6" onclick="event.stopPropagation()">
            <h3 class="text-white font-black text-xl">智能湊券助手</h3>
            <input type="number" id="billAmount" oninput="runSmartMatch()" placeholder="輸入金額..." class="w-full bg-slate-800 border-none rounded-3xl py-6 text-4xl font-black text-rose-400 text-center outline-none">
            <div id="smartResult" class="hidden space-y-4">
                <div id="smartPlanList" class="space-y-2 max-h-48 overflow-y-auto no-scrollbar"></div>
                <button onclick="applySmartRedeem()" class="w-full bg-rose-600 py-4 rounded-2xl font-black text-white">確認使用</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCJY3vzA7xuC-bC6PLGk5wGAe_rjPMP4w4", authDomain: "testing-a7aba.firebaseapp.com", projectId: "testing-a7aba", databaseURL: "https://testing-a7aba-default-rtdb.firebaseio.com/", appId: "1:94291975544:web:1fc1e0aff39d8fd0357c8d" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const MEMBERS = ['爸爸', '媽媽', '姐姐', '昌哥', '妹妹'];
        const WEEK_DATA = [];
        const START_DATE = new Date('2026-04-10');
        for(let i=0; i<10; i++){ 
            let s = new Date(START_DATE); s.setDate(s.getDate() + i*7); 
            let e = new Date(s); e.setDate(e.getDate() + 6); 
            WEEK_DATA.push({ id:i+1, key:`2026-W${i+1}`, start:s, end:e, range:`${s.getMonth()+1}/${s.getDate()}-${e.getMonth()+1}/${e.getDate()}` }); 
        }
        
        let currentWeekKey = WEEK_DATA[0].key;
        let currentUser = '爸爸';
        let activeSlot = 0;
        let slotValues = [0,0,0];
        let allCoupons = {};
        let selectedMembers = new Set(); 
        let selectedPlatforms = new Set();

        function autoJumpToCurrentWeek() {
            const now = new Date();
            const found = WEEK_DATA.find(w => now >= w.start && now <= w.end);
            if (found) { currentWeekKey = found.key; document.getElementById('weekDropdown').value = found.key; }
        }

        function updateSummaryTable() {
            const wkData = allCoupons[currentWeekKey] || {};
            const res = {}; MEMBERS.forEach(m => res[m] = { platforms: {} });
            let gRem = 0, gUsed = 0;

            Object.values(wkData).forEach(c => {
                const m = (c.member === '家姐' || c.member === '姐') ? '姐姐' : c.member;
                if(!res[m]) return;
                if(!res[m].platforms[c.payment]) res[m].platforms[c.payment] = { rem: 0, used: 0, zero: 0 };
                if(c.amount === 0) { res[m].platforms[c.payment].zero++; }
                else if(c.used) { res[m].platforms[c.payment].used += c.amount; gUsed += c.amount; }
                else { res[m].platforms[c.payment].rem += c.amount; gRem += c.amount; }
            });

            let bodyHtml = "";
            MEMBERS.forEach(m => {
                const pKeys = Object.keys(res[m].platforms); if(pKeys.length === 0) return;
                let mRem = 0;
                pKeys.forEach((p, idx) => {
                    const d = res[m].platforms[p]; mRem += d.rem;
                    let amountDisplay = "";
                    if(d.rem > 0) amountDisplay += `<div>${d.rem}</div>`;
                    if(d.used > 0) amountDisplay += `<div class="text-[10px] text-slate-400 line-through">(${d.used})</div>`;
                    if(d.zero > 0) amountDisplay += `<div class="text-[10px] text-slate-400 italic">謝謝參與×${d.zero}</div>`;
                    bodyHtml += `<tr>${idx === 0 ? `<td rowspan="${pKeys.length + 1}" class="font-bold text-${m} border-r">${m}</td>` : ''}<td class="text-slate-500 border-r">${p}</td><td>${amountDisplay || '0'}</td><td class="font-mono text-slate-400">${d.rem > 0 ? d.rem*3 : ''}</td></tr>`;
                });
                bodyHtml += `<tr class="subtotal-row"><td class="text-[12px] text-slate-400 border-r">小計</td><td>${mRem > 0 ? mRem : ''}</td><td class="font-mono text-slate-400">${mRem > 0 ? mRem*3 : ''}</td></tr>`;
            });
            document.getElementById('redeemTableBody').innerHTML = bodyHtml || '<tr><td colspan="4" class="py-10 text-slate-400">本週無數據</td></tr>';
            document.getElementById('redeemTableFoot').innerHTML = (gRem+gUsed)>0 ? `<tr class="grand-total-row"><td colspan="2" class="py-4">總計</td><td>${gRem}</td><td class="font-mono text-emerald-400">${gRem*3}</td></tr>` : '';

            // 明細列表
            let listHtml = ""; const groups = {};
            Object.keys(wkData).forEach(id => {
                const c = wkData[id]; const m = (c.member === '家姐' || c.member === '姐') ? '姐姐' : c.member;
                if (selectedMembers.size > 0 && !selectedMembers.has(m)) return;
                if (selectedPlatforms.size > 0 && !selectedPlatforms.has(c.payment)) return;
                const key = `${m}-${c.payment}`;
                if(!groups[key]) groups[key] = { m, p: c.payment, items: [] };
                groups[key].items.push({ id, ...c });
            });

            Object.values(groups).forEach(g => {
                listHtml += `<div class="space-y-3"><div class="flex items-center gap-2 px-1"><span class="w-1.5 h-4 bg-${g.m} rounded-full"></span><span class="font-black text-sm text-slate-700">${g.m} · ${g.p}</span></div><div class="coupon-group-box">`;
                g.items.sort((a,b)=>b.amount-a.amount).forEach(c => {
                    const isZero = (c.amount === 0);
                    listHtml += `<div class="coupon-card ${c.used?'used':''} ${isZero?'zero':''}"><div class="${isZero?'text-[10px]':'text-xl'} font-black ${isZero?'text-slate-400':'text-slate-800'} mb-2">${isZero?'謝謝參與':c.amount}</div><div class="flex gap-1">${isZero ? `<button onclick="deleteCoupon('${c.id}')" class="w-full py-1.5 text-rose-300 font-bold text-[10px]">移除紀錄</button>` : `<button onclick="toggleCoupon('${c.id}')" class="flex-1 py-1.5 bg-slate-100 rounded-lg text-[10px] font-bold">${c.used?'還原':'核銷'}</button><button onclick="deleteCoupon('${c.id}')" class="px-1 py-1.5 text-rose-300 font-bold">✕</button>`}</div></div>`;
                });
                listHtml += `</div></div>`;
            });
            document.getElementById('individualList').innerHTML = listHtml;
        }

        function updateStatsUI() {
            const mode = document.getElementById('statMode').value;
            const res = {}; MEMBERS.forEach(m => res[m] = { platforms: {} });
            Object.keys(allCoupons).forEach(wk => {
                if (mode === 'week' && wk !== currentWeekKey) return;
                Object.values(allCoupons[wk]).forEach(c => {
                    const m = (c.member === '家姐' || c.member === '姐') ? '姐姐' : c.member;
                    if (!res[m]) return;
                    if (!res[m].platforms[c.payment]) res[m].platforms[c.payment] = {用:0, 剩:0, 實:0};
                    const d = res[m].platforms[c.payment];
                    if(c.amount > 0) {
                        if(c.used) { d.用 += c.amount; d.實 += parseFloat(c.realPayPart || (c.amount*2)); }
                        else { d.剩 += c.amount; }
                    }
                });
            });
            let h = ""; let gU=0, gR=0, gP=0;
            MEMBERS.forEach(m => {
                const pKeys = Object.keys(res[m].platforms); if(!pKeys.length) return;
                let mu=0, mr=0, mp=0;
                pKeys.forEach((p, i) => {
                    const d = res[m].platforms[p]; mu+=d.用; mr+=d.剩; mp+=d.實;
                    h += `<tr>${i===0?`<td rowspan="${pKeys.length+1}" class="text-${m} font-bold border-r">${m}</td>`:''}<td class="text-[12px] border-r">${p}</td><td>${d.用}/${d.剩}</td><td class="text-emerald-600 font-bold font-mono">${Math.round(mp)}</td></tr>`;
                });
                h += `<tr class="subtotal-row"><td colspan="2" class="text-right px-2 text-[10px]">小計</td><td>${mu}/${mr}</td><td class="text-emerald-700">${Math.round(mp)}</td></tr>`;
                gU+=mu; gR+=mr; gP+=mp;
            });
            document.getElementById('memberTableBody').innerHTML = h || '<tr><td colspan="4" class="py-10">無數據</td></tr>';
            document.getElementById('tableGrandTotal').innerHTML = `<tr class="grand-total-row"><td>總計</td><td></td><td>${gU}/${gR}</td><td class="text-emerald-400 text-xl font-mono">${Math.round(gP)}</td></tr>`;
        }

        // --- 核心操作函數 ---
        function selectUser(name) {
            currentUser = name;
            document.querySelectorAll('.member-btn').forEach(btn => {
                btn.className = 'member-btn py-3 rounded-xl font-bold text-[11px] bg-slate-100';
            });
            document.getElementById(`btn-${name}`).classList.add(`active-${name}`);
        }

        function setSlotValue(v) {
            slotValues[activeSlot] = v;
            document.getElementById(`slot-${activeSlot}`).setAttribute('data-touched', 'true');
            activeSlot = (activeSlot + 1) % 3;
            updateSlotUI();
        }

        function updateSlotUI() { 
            slotValues.forEach((v, i) => { 
                const el = document.getElementById(`slot-${i}`); 
                const isTouched = el.getAttribute('data-touched') === 'true';
                el.innerText = (isTouched && v === 0) ? '謝謝' : v; 
                el.className = `flex-1 py-6 border-2 rounded-2xl text-center font-black text-2xl transition-all ${isTouched ? (v===0?'border-slate-300 bg-slate-100 text-slate-400':'border-slate-800 bg-white text-slate-800') : 'border-slate-200 bg-slate-50 text-slate-300'} ${i === activeSlot ? 'border-rose-500 scale-105 shadow-md ring-4 ring-rose-50' : ''}`; 
            }); 
        }

        function submitBatch() { 
            const p = document.getElementById('platformSelect').value; 
            let count = 0;
            slotValues.forEach((v, i) => { 
                if(document.getElementById(`slot-${i}`).getAttribute('data-touched') === 'true') {
                    db.ref(`coupons/${currentWeekKey}/${Date.now()+i}`).set({ amount:v, member:currentUser, payment:p, used:false }); 
                    count++;
                }
            }); 
            if(count > 0) {
                slotValues=[0,0,0]; activeSlot=0; 
                [0,1,2].forEach(i => document.getElementById(`slot-${i}`).setAttribute('data-touched', 'false'));
                updateSlotUI();
                alert(`${currentUser} 的 ${count} 筆獎賞已登記！`);
            } else {
                alert('請先點選金額或謝謝參與');
            }
        }

        function toggleFilter(type, val) { 
            const set = (type === 'member') ? selectedMembers : selectedPlatforms; 
            if (set.has(val)) set.delete(val); else set.add(val); 
            document.querySelectorAll(`[data-val="${val}"]`).forEach(el => el.classList.toggle('active'));
            updateSummaryTable(); 
        }

        function switchTab(t) { 
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); 
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-rose-600', 'text-slate-400')); 
            document.getElementById('tab-'+t).classList.add('active'); 
            document.getElementById('nav-'+t).classList.replace('text-slate-400', 'text-rose-600'); 
            if(t==='stat') updateStatsUI(); 
        }

        function changeWeek(v) { currentWeekKey = v; updateSummaryTable(); updateStatsUI(); }
        function deleteCoupon(id) { if(confirm('確定刪除？')) db.ref(`coupons/${currentWeekKey}/${id}`).remove(); }
        function toggleCoupon(id) { const c = allCoupons[currentWeekKey][id]; if(c.amount === 0) return; const ns = !c.used; db.ref(`coupons/${currentWeekKey}/${id}`).update({ used: ns, realPayPart: ns ? (c.amount*2) : 0 }); }
        function toggleCalc(s) { document.getElementById('calculatorModal').classList.toggle('hidden', !s); if(s) { document.getElementById('billAmount').value=''; document.getElementById('smartResult').classList.add('hidden'); } }
        function toggleZoom() { document.documentElement.style.fontSize = document.documentElement.style.fontSize === '22px' ? '18px' : '22px'; }

        function runSmartMatch() {
            const bill = parseFloat(document.getElementById('billAmount').value) || 0;
            const resArea = document.getElementById('smartResult');
            if(bill <= 0) { resArea.classList.add('hidden'); return; }
            resArea.classList.remove('hidden');
            const av = [];
            Object.values(allCoupons[currentWeekKey] || {}).forEach(c => {
                const m = (c.member === '家姐' || c.member === '姐') ? '姐姐' : c.member;
                if(!c.used && c.amount > 0 && (selectedMembers.size===0 || selectedMembers.has(m))) av.push({...c, m});
            });
            av.sort((a,b)=>b.amount-a.amount);
            let rem = bill, disc = 0, html = ""; window.tempMatched = [];
            for(let c of av) { if(rem >= c.amount*3) { rem -= c.amount*3; html += `<div class="text-white text-xs bg-white/10 p-2 rounded-xl flex justify-between"><span>${c.m}·${c.payment}</span><span>-${c.amount}</span></div>`; window.tempMatched.push(c); } }
            document.getElementById('smartPlanList').innerHTML = html || '<div class="text-slate-500 text-center py-4">無可用券</div>';
        }

        function applySmartRedeem() {
            if(!window.tempMatched?.length) return;
            const bill = parseFloat(document.getElementById('billAmount').value);
            const totalC = window.tempMatched.reduce((a,b)=>a+b.amount,0);
            window.tempMatched.forEach(t => db.ref(`coupons/${currentWeekKey}/${t.id}`).update({ used:true, realPayPart: (t.amount/totalC)*(bill-totalC) }));
            toggleCalc(false);
        }

        db.ref('coupons').on('value', s => { allCoupons = s.val() || {}; updateSummaryTable(); updateStatsUI(); });
        window.onload = () => { 
            const drp = document.getElementById('weekDropdown'); 
            WEEK_DATA.forEach(w => { const o = document.createElement('option'); o.value = w.key; o.textContent = `2026 第 ${w.id} 週 (${w.range})`; drp.appendChild(o); }); 
            autoJumpToCurrentWeek(); 
            selectUser('爸爸'); // 默認選中
            updateSlotUI();
        };
    </script>
</body>
</html>
