<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消費獎賞2025 – 家庭紀錄表</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>消費獎賞2025 – 家庭紀錄表</h1>
    <div id="errorMessage" style="color: red; display: none;"></div>
    <div id="loading" class="spinner" style="display: none;"></div>
    <div class="controls">
      <button class="icon-button" onclick="openModal()">➕ 新增優惠券</button>
      <select id="weekSelector"></select>
      <button class="icon-button export-btn" onclick="exportToExcel()" title="匯出 Excel">
        <img src="https://img.icons8.com/ios-filled/24/ffffff/download.png" alt="下載">
      </button>
      <select id="memberFilter">
        <option value="">所有家庭成員</option>
        <option value="爸爸">爸爸</option>
        <option value="媽媽">媽媽</option>
        <option value="家姐">家姐</option>
        <option value="昌哥">昌哥</option>
        <option value="妹妹">妹妹</option>
      </select>
      <select id="paymentFilter">
        <option value="">所有支付方式</option>
        <option value="中銀">中銀</option>
        <option value="工商">工商</option>
        <option value="國際">國際</option>
        <option value="大豐">大豐</option>
        <option value="MPay">MPay</option>
        <option value="UEPay">UEPay</option>
        <option value="支付寶(澳門)">支付寶(澳門)</option>
      </select>
    </div>
    <div id="summaryTableContainer"></div>
    <div id="tableContainer"></div>
    <div id="entryModal" class="modal hidden">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">❌</span>
        <h2>新增優惠券</h2>
        <form id="entryForm">
          <label>家庭成員：</label>
          <select id="member">
            <option value="爸爸">爸爸</option>
            <option value="媽媽">媽媽</option>
            <option value="家姐">家姐</option>
            <option value="昌哥">昌哥</option>
            <option value="妹妹">妹妹</option>
          </select>
          <label>支付方式：</label>
          <select id="payment">
            <option value="中銀">中銀</option>
            <option value="工商">工商</option>
            <option value="國際">國際</option>
            <option value="大豐">大豐</option>
            <option value="MPay">MPay</option>
            <option value="UEPay">UEPay</option>
            <option value="支付寶(澳門)">支付寶(澳門)</option>
          </select>
          <label>金額 1：</label>
          <select id="amount1">
            <option value="0">0 元 (未抽中)</option>
            <option value="10">10 元</option>
            <option value="20">20 元</option>
            <option value="50">50 元</option>
            <option value="100">100 元</option>
            <option value="200">200 元</option>
          </select>
          <label>金額 2：</label>
          <select id="amount2">
            <option value="0">0 元 (未抽中)</option>
            <option value="10">10 元</option>
            <option value="20">20 元</option>
            <option value="50">50 元</option>
            <option value="100">100 元</option>
            <option value="200">200 元</option>
          </select>
          <label>金額 3：</label>
          <select id="amount3">
            <option value="0">0 元 (未抽中)</option>
            <option value="10">10 元</option>
            <option value="20">20 元</option>
            <option value="50">50 元</option>
            <option value="100">100 元</option>
            <option value="200">200 元</option>
          </select>
          <button type="submit">✅ 新增</button>
        </form>
      </div>
    </div>
  </div>
  <script defer src="script.js"></script>
</body>
</html>
