<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <title>消費券</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="消費券">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main>
    <!-- 用券: what is left this week, and how to pay for a purchase -->
    <section id="use" aria-labelledby="caption">
      <p id="caption" class="caption"></p>
      <p id="hero" class="hero"></p>
      <label class="price">
        <span>要買</span>
        <input id="price" type="text" inputmode="decimal" autocomplete="off" placeholder="價錢" aria-label="要買的價錢（MOP）">
        <button id="clearPrice" type="button" aria-label="清除價錢" hidden>×</button>
      </label>
      <label id="merchantBox" class="check" hidden><input id="merchantOk" type="checkbox"><span>這間店可用商戶券</span></label>
      <p id="verdict" class="verdict" role="status" hidden></p>
      <div id="useList"></div>
      <button id="markPlan" class="primary" type="button" hidden>已付款，記為已用</button>
      <details id="usedBox" hidden>
        <summary id="usedSummary"></summary>
        <div id="usedList" class="list"></div>
      </details>
    </section>

    <!-- 登記: record the three draws of each wallet -->
    <section id="register" aria-labelledby="regCaption" hidden>
      <p id="regCaption" class="caption"></p>
      <div id="regList"></div>
      <details>
        <summary>錢包設定</summary>
        <div id="walletSettings"></div>
      </details>
    </section>
  </main>

  <nav class="tabs" aria-label="頁面">
    <a href="#use" data-tab="use">用券</a>
    <a href="#register" data-tab="register">登記<b id="badge" hidden></b></a>
  </nav>

  <dialog id="sheet" aria-labelledby="sheetTitle">
    <form id="sheetForm" method="dialog">
      <h2 id="sheetTitle"></h2>
      <div id="sheetBody"></div>
      <button id="sheetOk" class="primary" type="submit"></button>
      <button id="sheetCancel" class="plain" type="button">取消</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="./core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
