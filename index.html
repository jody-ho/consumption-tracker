<!DOCTYPE html>
<html lang="zh-Hant" style="font-size: 18px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 消費獎賞助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .member-btn.active { background-color: #0f172a !important; color: white !important; }
        
        .data-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .data-table th { background: #f8fafc; color: #64748b; font-size: 13px; padding: 12px 4px; border-bottom: 2px solid #e2e8f0; text-align: center; }
        .data-table td { padding: 12px 4px; border-bottom: 1px solid #f1f5f9; font-size: 16px; text-align: center; vertical-align: middle; line-height: 1.2; overflow: hidden; }
        
        .clickable-cell { cursor: pointer; transition: background 0.2s; }
        .clickable-cell:active { background-color: #f1f5f9; }
        
        .subtotal-row { background-color: #f8fafc; font-weight: bold; cursor: pointer; }
        .grand-total-row { background-color: #0f172a !important; color: white !important; font-weight: 900; cursor: pointer; }

        .line-through { text-decoration: line-through; opacity: 0.4; }
        .text-used { font-size: 11px; font-weight: normal; }

        .bg-爸爸 { background-color: #3b82f6; } .text-爸爸 { color: #3b82f6; }
        .bg-媽媽 { background-color: #ec4899; } .text-媽媽 { color: #ec4899; }
        .bg-姐姐 { background-color: #10b981; } .text-姐姐 { color: #10b981; }
        .bg-昌哥 { background-color: #f59e0b; } .text-昌哥 { color: #f59e0b; }
        .bg-妹妹 { background-color: #8b5cf6; } .text-妹妹 { color: #8b5cf6; }

        #smartFab { position: fixed; right: 20px; bottom: 120px; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); z-index: 100; }
        #calculatorModal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.8); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
        .slot-active { border-color: #0f172a !important; background-color: #fff !important; box-shadow: 0 0 0 2px #0f172a; }
    
        .filter-chip { 
            flex: 0 0 auto; padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: bold; 
            border: 1.5px solid #e2e8f0; color: #64748b; background: white; transition: all 0.2s;
        }
        .filter-chip.active { background: #0f172a; color: white; border-color: #0f172a; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 緊湊型卡片 */
        .coupon-card { 
            background: white; border-radius: 16px; padding: 10px; border: 1px solid #e2e8f0;
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .coupon-card.used { background: #f8fafc; border-style: dashed; opacity: 0.6; }
        .coupon-card.used::after { 
            content: "已核銷"; position: absolute; right: -10px; bottom: 5px; 
            transform: rotate(-15deg); font-size: 10px; color: #94a3b8; 
            border: 1px solid #cbd5e1; padding: 2px 8px; border-radius: 4px;
        }
    </style>
</head>
<body class="pb-32">

    <div class="max-w-md mx-auto">
        <header class="bg-white sticky top-0 z-50 p-4 shadow-sm flex items-center justify-between">
            <select id="weekDropdown" onchange="changeWeek(this.value)" class="font-black text-slate-800 bg-transparent outline-none flex-1 text-base"></select>
            <button onclick="toggleZoom()" class="bg-slate-100 px-3 py-1.5 rounded-full text-[10px] font-bold text-slate-500 uppercase">A±</button>
        </header>

        <div id="tab-redeem" class="tab-content active p-4 space-y-4">
            <section class="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden">
                <div class="bg-emerald-600 p-3 text-white text-center text-[10px] font-bold tracking-widest uppercase">本週數據匯總</div>
                <table class="data-table">
                    <thead><tr><th class="w-16">成員</th><th class="w-20">平台</th><th>面額</th><th>需消費</th></tr></thead>
                    <tbody id="redeemTableBody"></tbody>
                    <tfoot id="redeemTableFoot"></tfoot>
                </table>
            </section>
            <button id="smartFab" onclick="toggleCalc(true)" class="bg-rose-600 text-white shadow-rose-500/50">🛒</button>
            <div id="calculatorModal" onclick="if(event.target===this) toggleCalc(false)">
                <div class="bg-slate-900 w-full rounded-3xl p-6 shadow-2xl space-y-4" onclick="event.stopPropagation()">
                    <div class="flex justify-between items-center text-white"><h3 class="font-black">智能湊券</h3><button onclick="toggleCalc(false)" class="text-slate-400">關閉</button></div>
                    <input type="number" id="billAmount" oninput="runSmartMatch()" placeholder="輸入總額..." class="w-full bg-slate-800 border-none rounded-2xl py-4 text-3xl font-black text-rose-400 outline-none text-center">
                    <div id="smartResult" class="hidden bg-slate-800/50 rounded-2xl p-4 border border-white/5">
                        <div id="smartPlanList" class="space-y-1 mb-3 text-xs text-slate-300 border-b border-white/10 pb-2"></div>
                        <div class="flex justify-between items-center"><span class="text-xs text-slate-400">實付:</span><span id="predictPay" class="text-2xl font-black text-emerald-400">0</span></div>
                        <button onclick="applySmartRedeem()" class="w-full bg-rose-600 py-3 rounded-xl font-black text-sm mt-3 text-white">確認使用</button>
                    </div>
                </div>
            </div>
            <details class="mt-4" open>
                <div class="sticky top-[68px] bg-slate-50 z-40 py-3 space-y-3 shadow-sm border-b -mx-4 px-4">
                <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar" id="memberFilter">
                    <button onclick="setFilter('member', 'all')" class="filter-chip active" data-type="member" data-val="all">全部成員</button>
                    <button onclick="setFilter('member', '爸爸')" class="filter-chip border-爸爸 text-爸爸" data-type="member" data-val="爸爸">爸爸</button>
                    <button onclick="setFilter('member', '媽媽')" class="filter-chip border-媽媽 text-媽媽" data-type="member" data-val="媽媽">媽媽</button>
                    <button onclick="setFilter('member', '姐姐')" class="filter-chip border-姐姐 text-姐姐" data-type="member" data-val="姐姐">姐姐</button>
                    <button onclick="setFilter('member', '昌哥')" class="filter-chip border-昌哥 text-昌哥" data-type="member" data-val="昌哥">昌哥</button>
                    <button onclick="setFilter('member', '妹妹')" class="filter-chip border-妹妹 text-妹妹" data-type="member" data-val="妹妹">妹妹</button>
                </div>
                <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar" id="platformFilter">
                    <button onclick="setFilter('platform', 'all')" class="filter-chip active" data-type="platform" data-val="all">所有平台</button>
                    </div>
                </div>

                <div id="individualList" class="grid grid-cols-2 gap-2 mt-4"></div>
            </details>
        </div>

        <div id="tab-stat" class="tab-content p-4 space-y-5">
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gradient-to-br from-amber-500 to-orange-600 p-4 rounded-3xl text-white shadow-lg"><p class="text-[10px] font-bold opacity-80 uppercase">🏆 手氣王</p><p id="luckyKing" class="text-xl font-black">--</p></div>
                <div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-4 rounded-3xl text-white shadow-lg"><p class="text-[10px] font-bold opacity-80 uppercase">💎 最強平台</p><p id="topPlatform" class="text-xl font-black">--</p></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-3xl border border-slate-200 text-center"><p class="text-[10px] font-bold text-slate-400 uppercase">總抽到</p><p id="statTotalDrawn" class="text-2xl font-black text-slate-800">0</p></div>
                <div class="bg-white p-4 rounded-3xl border border-emerald-100 text-center"><p class="text-[10px] font-bold text-emerald-600 uppercase">累計已用</p><p id="statUsedAmt" class="text-2xl font-black text-emerald-600">0</p></div>
            </div>
            <div class="flex justify-between items-center px-1">
                <h3 class="font-black text-slate-800">📊 財務總表</h3>
                <select id="statMode" onchange="updateStatsUI()" class="text-xs font-bold bg-white border px-2 py-1 rounded-lg outline-none">
                    <option value="week">本週</option><option value="grand">全期</option>
                </select>
            </div>
            <section class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="data-table">
                    <thead><tr><th class="w-14">成員</th><th class="w-16">平台</th><th class="w-16">已用</th><th>剩餘(需)</th><th class="w-18">已付</th></tr></thead>
                    <tbody id="memberTableBody"></tbody>
                    <tfoot id="tableGrandTotal"></tfoot>
                </table>
            </section>
        </div>

        <div id="tab-input" class="tab-content p-4 space-y-6">
            <section class="bg-white rounded-3xl p-5 shadow-sm border space-y-4">
                <div class="grid grid-cols-5 gap-1.5">
                    <button onclick="selectUser('爸爸', this)" class="member-btn py-3 rounded-xl font-bold text-[11px] bg-slate-100 active">爸爸</button>
                    <button onclick="selectUser('媽媽', this)" class="member-btn py-3 rounded-xl font-bold text-[11px] bg-slate-100">媽媽</button>
                    <button onclick="selectUser('姐姐', this)" class="member-btn py-3 rounded-xl font-bold text-[11px] bg-slate-100">姐姐</button>
                    <button onclick="selectUser('昌哥', this)" class="member-btn py-3 rounded-xl font-bold text-[11px] bg-slate-100">昌哥</button>
                    <button onclick="selectUser('妹妹', this)" class="member-btn py-3 rounded-xl font-bold text-[11px] bg-slate-100">妹妹</button>
                </div>
                <select id="platformSelect" class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 font-black text-base outline-none">
                    <option>MPay</option><option>中銀</option><option>工銀</option><option>大豐</option><option>國際</option><option>支付寶</option><option>UEPay</option>
                </select>
            </section>
            
            <section class="space-y-3">
                <div class="flex gap-3">
                    <div class="flex-1 flex flex-col gap-2"><div id="slot-0" onclick="activeSlot=0; updateSlotUI()" class="py-6 border-2 border-slate-200 rounded-2xl text-center font-black text-2xl bg-white">0</div><button onclick="clearSlot(0)" class="text-[10px] py-1.5 bg-slate-200 text-slate-500 rounded-lg font-bold">清除</button></div>
                    <div class="flex-1 flex flex-col gap-2"><div id="slot-1" onclick="activeSlot=1; updateSlotUI()" class="py-6 border-2 border-slate-200 rounded-2xl text-center font-black text-2xl bg-white">0</div><button onclick="clearSlot(1)" class="text-[10px] py-1.5 bg-slate-200 text-slate-500 rounded-lg font-bold">清除</button></div>
                    <div class="flex-1 flex flex-col gap-2"><div id="slot-2" onclick="activeSlot=2; updateSlotUI()" class="py-6 border-2 border-slate-200 rounded-2xl text-center font-black text-2xl bg-white">0</div><button onclick="clearSlot(2)" class="text-[10px] py-1.5 bg-slate-200 text-slate-500 rounded-lg font-bold">清除</button></div>
                </div>
            </section>

            <div class="grid grid-cols-3 gap-3">
                <button onclick="setSlotValue(10)" class="bg-white border py-4 rounded-2xl font-black text-xl active:bg-slate-50">10</button>
                <button onclick="setSlotValue(20)" class="bg-white border py-4 rounded-2xl font-black text-xl active:bg-slate-50">20</button>
                <button onclick="setSlotValue(50)" class="bg-white border py-4 rounded-2xl font-black text-xl active:bg-slate-50">50</button>
                <button onclick="setSlotValue(100)" class="bg-amber-50 border-amber-200 py-4 rounded-2xl font-black text-xl text-amber-600 active:bg-amber-100">100</button>
                <button onclick="setSlotValue(200)" class="bg-rose-50 border-rose-200 py-4 rounded-2xl font-black text-xl text-rose-600 active:bg-rose-100">200</button>
            </div>

            <button onclick="submitBatch()" class="w-full bg-slate-800 text-white py-5 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">📥 登記獎賞</button>
        </div>

        <nav class="fixed bottom-0 left-0 right-0 h-24 bg-white border-t flex justify-around items-center z-50 shadow-2xl">
            <button onclick="switchTab('redeem')" id="nav-redeem" class="flex-1 flex flex-col items-center font-bold text-sm text-rose-600"><span class="text-2xl mb-1">🛒</span>使用</button>
            <button onclick="switchTab('input')" id="nav-input" class="flex-1 flex flex-col items-center font-bold text-sm text-slate-400"><span class="text-2xl mb-1">📥</span>登記</button>
            <button onclick="switchTab('stat')" id="nav-stat" class="flex-1 flex flex-col items-center font-bold text-sm text-slate-400"><span class="text-2xl mb-1">📊</span>帳目</button>
        </nav>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCJY3vzA7xuC-bC6PLGk5wGAe_rjPMP4w4",
            authDomain: "testing-a7aba.firebaseapp.com",
            projectId: "testing-a7aba",
            databaseURL: "https://testing-a7aba-default-rtdb.firebaseio.com/",
            appId: "1:94291975544:web:1fc1e0aff39d8fd0357c8d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const MEMBERS = ['爸爸', '媽媽', '姐姐', '昌哥', '妹妹'];
        const WEEK_DATA = [];
        const START_DATE = new Date('2026-04-10');
        for(let i=0; i<10; i++){
            let s = new Date(START_DATE); s.setDate(s.getDate() + i*7);
            let e = new Date(s); e.setDate(e.getDate() + 6);
            WEEK_DATA.push({ id:i+1, key:`2026-W${i+1}`, range:`${s.getMonth()+1}/${s.getDate()}-${e.getMonth()+1}/${e.getDate()}` });
        }
        let currentWeekKey = WEEK_DATA[0].key;
        let currentUser = '爸爸';
        let activeSlot = 0;
        let slotValues = [0,0,0];
        let allCoupons = {};
        const validWeekKeys = WEEK_DATA.map(w => w.key);

        let currentFilters = { member: 'all', platform: 'all' };

        function setFilter(type, val) {
            currentFilters[type] = val;
            // 更新 UI 狀態
            document.querySelectorAll(`.filter-chip[data-type="${type}"]`).forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-val') === val);
            });
            updateSummaryTable(); // 重新渲染列表
        }

        function updateSummaryTable() {
            const wkData = allCoupons[currentWeekKey] || {};
            const res = {}; MEMBERS.forEach(m => res[m] = { platforms: {} });
            let gFaceRem = 0, gFaceUsed = 0;
            Object.values(wkData).forEach(c => {
                const m = (c.member === '家姐' || c.member === '姐') ? '姐姐' : c.member;
                if(!res[m].platforms[c.payment]) res[m].platforms[c.payment] = { rem: 0, used: 0 };
                if(c.used) { res[m].platforms[c.payment].used += c.amount; gFaceUsed += c.amount; }
                else { res[m].platforms[c.payment].rem += c.amount; gFaceRem += c.amount; }
            });
            let bodyHtml = "";
            MEMBERS.forEach(m => {
                const pKeys = Object.keys(res[m].platforms); if(pKeys.length === 0) return;
                let mRem = 0, mUsed = 0;
                pKeys.forEach((p, idx) => {
                    const d = res[m].platforms[p]; mRem += d.rem; mUsed += d.used;
                    const isFullyUsed = d.rem === 0;
                    bodyHtml += `<tr>${idx === 0 ? `<td rowspan="${pKeys.length + 1}" class="font-bold text-${m} border-r clickable-cell" onclick="bulkToggle('${m}')">${m}</td>` : ''}<td class="text-slate-500 border-r text-xs clickable-cell ${isFullyUsed?'line-through':''}" onclick="bulkToggle('${m}', '${p}')">${p}</td><td class="font-mono ${isFullyUsed?'line-through':''}">${d.rem > 0 ? d.rem : ''}${d.used > 0 ? `<div class="text-used text-slate-400 line-through">(${d.used})</div>` : ''}</td><td class="font-mono text-slate-400 text-xs ${isFullyUsed?'line-through':''}">${d.rem > 0 ? d.rem*3 : ''}</td></tr>`;
                });
                bodyHtml += `<tr class="subtotal-row" onclick="bulkToggle('${m}')"><td class="text-[10px] text-slate-400 border-r">${m} 總計</td><td class="font-mono">${mRem > 0 ? mRem : ''}${mUsed > 0 ? `<div class="text-used line-through">(${mUsed})</div>` : ''}</td><td class="font-mono text-slate-500">${mRem > 0 ? mRem*3 : ''}</td></tr>`;
            });
            document.getElementById('redeemTableBody').innerHTML = bodyHtml || '<tr><td colspan="4" class="py-10 text-slate-400">本週暫無數據</td></tr>';
            document.getElementById('redeemTableFoot').innerHTML = (gFaceRem+gFaceUsed)>0 ? `<tr class="grand-total-row" onclick="bulkToggle()"><td colspan="2" class="text-xs">全家總計</td><td class="font-mono">${gFaceRem>0?gFaceRem:''} <div class="text-used opacity-60 line-through">(${gFaceUsed})</div></td><td class="font-mono text-emerald-400">${gFaceRem>0?gFaceRem*3:''}</td></tr>` : '';
            
            // 更新平台篩選按鈕 (動態獲取當週有的平台)
            const platforms = [...new Set(Object.values(wkData).map(c => c.payment))];
            let pFilterHtml = `<button onclick="setFilter('platform', 'all')" class="filter-chip ${currentFilters.platform==='all'?'active':''}" data-type="platform" data-val="all">所有平台</button>`;
            platforms.forEach(p => {
                pFilterHtml += `<button onclick="setFilter('platform', '${p}')" class="filter-chip ${currentFilters.platform===p?'active':''}" data-type="platform" data-val="${p}">${p}</button>`;
            });
            document.getElementById('platformFilter').innerHTML = pFilterHtml;

            // 渲染過濾後的清單
            let listHtml = "";
            Object.keys(wkData).reverse().forEach(id => {
                const c = wkData[id];
                const m = (c.member === '家姐' || c.member === '姐') ? '姐姐' : c.member;
                
                // 篩選邏輯
                if (currentFilters.member !== 'all' && m !== currentFilters.member) return;
                if (currentFilters.platform !== 'all' && c.payment !== currentFilters.platform) return;
            
                listHtml += `
                    <div class="coupon-card ${c.used ? 'used' : ''}">
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-6 h-6 rounded-full bg-${m} text-white flex items-center justify-center text-[10px] font-bold">${m[0]}</div>
                            <span class="text-[10px] font-bold text-slate-500">${c.payment}</span>
                        </div>
                        <div class="text-xl font-black text-slate-800 mb-2">${c.amount}</div>
                        <div class="flex gap-1 mt-auto">
                            <button onclick="toggleCoupon('${id}')" class="flex-1 py-1.5 bg-slate-100 rounded-lg text-[10px] font-bold">${c.used?'還原':'核銷'}</button>
                            <button onclick="deleteCoupon('${id}')" class="px-2 py-1.5 text-rose-400 text-[10px]">✕</button>
                        </div>
                    </div>`;
            });
            document.getElementById('individualList').innerHTML = listHtml || '<div class="col-span-2 text-center text-slate-400 py-10 text-xs">沒有符合篩選條件的獎賞</div>';   
        }

        function updateStatsUI() {
            const mode = document.getElementById('statMode').value; const res = { totalDrawn: 0, usedAmt: 0, members: {}, platforms: {} };
            MEMBERS.forEach(m => res.members[m] = { val: 0, platforms: {} });
            Object.keys(allCoupons).forEach(wk => {
                if (mode === 'week' && wk !== currentWeekKey) return;
                if (mode === 'grand' && !validWeekKeys.includes(wk)) return;
                Object.values(allCoupons[wk]).forEach(c => {
                    const m = (c.member === '家姐' || c.member === '姐') ? '姐姐' : c.member; const p = c.payment; const amt = parseFloat(c.amount) || 0;
                    res.totalDrawn += amt; res.members[m].val += amt; if(!res.platforms[p]) res.platforms[p] = 0; res.platforms[p] += amt;
                    if(!res.members[m].platforms[p]) res.members[m].platforms[p] = { rem: 0, used: 0, real: 0 };
                    if(c.used) { res.usedAmt += amt; res.members[m].platforms[p].used += amt; res.members[m].platforms[p].real += parseFloat(c.realPayPart || (amt * 2)); }
                    else { res.members[m].platforms[p].rem += amt; }
                });
            });
            let king = "--", topP = "--", maxM = 0, maxP = 0;
            MEMBERS.forEach(m => { if(res.members[m].val > maxM) { maxM = res.members[m].val; king = `${m} (${maxM})`; } });
            Object.keys(res.platforms).forEach(p => { if(res.platforms[p] > maxP) { maxP = res.platforms[p]; topP = `${p} (${maxP})`; } });
            document.getElementById('luckyKing').innerText = king; document.getElementById('topPlatform').innerText = topP;
            document.getElementById('statTotalDrawn').innerText = res.totalDrawn; document.getElementById('statUsedAmt').innerText = res.usedAmt;
            let tableHtml = ""; let gRem = 0, gUsed = 0, gReal = 0;
            MEMBERS.forEach(m => {
                let mRem = 0, mUsed = 0, mReal = 0; const pKeys = Object.keys(res.members[m].platforms); if (pKeys.length === 0) return;
                pKeys.forEach((p, idx) => {
                    const d = res.members[m].platforms[p]; mRem += d.rem; mUsed += d.used; mReal += d.real;
                    tableHtml += `<tr>${idx===0?`<td rowspan="${pKeys.length + 1}" class="font-bold text-${m} border-r">${m}</td>`:''}<td class="text-slate-500 border-r text-xs">${p}</td><td class="border-r font-mono">${d.used}</td><td class="border-r font-mono font-bold">${d.rem}<div class="text-[10px] font-normal text-slate-400">需${d.rem*3}</div></td><td class="text-emerald-600 font-black font-mono">${Math.round(d.real)}</td></tr>`;
                });
                tableHtml += `<tr class="subtotal-row"><td class="text-[10px] text-slate-400 border-r">${m} 小計</td><td class="border-r font-mono">${mUsed}</td><td class="border-r font-mono">${mRem}<div class="text-[10px] font-normal">需${mRem*3}</div></td><td class="text-emerald-700 font-mono">${Math.round(mReal)}</td></tr>`;
                gRem += mRem; gUsed += mUsed; gReal += mReal;
            });
            document.getElementById('memberTableBody').innerHTML = tableHtml || '<tr><td colspan="5" class="py-10">無數據</td></tr>';
            document.getElementById('tableGrandTotal').innerHTML = `<tr class="grand-total-row"><td colspan="2" class="text-xs">全家總計</td><td class="font-mono">${gUsed}</td><td class="font-mono">${gRem}<div class="text-[10px] font-normal opacity-60">需${gRem*3}</div></td><td class="text-emerald-400 text-xl font-mono">${Math.round(gReal)}</td></tr>`;
        }

        function toggleCalc(show) { document.getElementById('calculatorModal').style.display = show ? 'flex' : 'none'; }
        function selectUser(n, b) { currentUser = n; document.querySelectorAll('.member-btn').forEach(btn => btn.classList.remove('active')); b.classList.add('active'); }
        function setSlotValue(v) { slotValues[activeSlot] = v; activeSlot = (activeSlot + 1) % 3; updateSlotUI(); }
        function clearSlot(idx) { slotValues[idx] = 0; updateSlotUI(); }
        function updateSlotUI() { slotValues.forEach((v, i) => { const el = document.getElementById(`slot-${i}`); el.innerText = v; el.className = `py-6 border-2 rounded-2xl text-center font-black text-2xl transition-all ${v>0 ? 'border-slate-800 bg-white' : 'border-slate-200 bg-slate-50'} ${i === activeSlot ? 'slot-active' : ''}`; }); }
        function switchTab(t) { document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-rose-600', 'text-slate-400')); document.getElementById('tab-'+t).classList.add('active'); document.getElementById('nav-'+t).classList.replace('text-slate-400', 'text-rose-600'); }
        function changeWeek(v) { currentWeekKey = v; updateSummaryTable(); updateStatsUI(); }
        function toggleZoom() { document.documentElement.style.fontSize = document.documentElement.style.fontSize === '22px' ? '18px' : '22px'; }
        function toggleCoupon(id) { const c = allCoupons[currentWeekKey][id]; const ns = !c.used; db.ref(`coupons/${currentWeekKey}/${id}`).update({ used: ns, realPayPart: ns ? (c.amount * 2) : 0, billAmount: ns ? (c.amount * 3) : 0 }); }
        function submitBatch() { 
            const p = document.getElementById('platformSelect').value; const vals = slotValues.filter(v=>v>0); if(vals.length===0) return;
            vals.forEach((amt, i) => db.ref(`coupons/${currentWeekKey}/${Date.now()+i}`).set({ amount:amt, member:currentUser, payment:p, used:false }));
            slotValues=[0,0,0]; activeSlot=0; updateSlotUI(); 
            const b = document.querySelector('#tab-input .bg-slate-800'); b.innerText = "成功 ✓"; setTimeout(() => b.innerText = "📥 登記獎賞", 1000);
        }
        function bulkToggle(tm = null, tp = null) {
            const wkData = allCoupons[currentWeekKey] || {}; const group = [];
            Object.keys(wkData).forEach(id => { const c = wkData[id]; const m = (c.member==='家姐'||c.member==='姐')?'姐姐':c.member; if((!tm||m===tm)&&(!tp||c.payment===tp)) group.push({id, used:c.used, amt:c.amount}); });
            if (!group.length || !confirm(`變更狀態？`)) return; const ns = !group.every(i=>i.used);
            group.forEach(i => db.ref(`coupons/${currentWeekKey}/${i.id}`).update({ used:ns, realPayPart:ns?(i.amt*2):0, billAmount:ns?(i.amt*3):0 }));
        }
        function runSmartMatch() {
            const bill = parseFloat(document.getElementById('billAmount').value) || 0; const resArea = document.getElementById('smartResult'); if (bill <= 0) { resArea.classList.add('hidden'); return; } resArea.classList.remove('hidden');
            const av = []; Object.values(allCoupons[currentWeekKey] || {}).forEach((c, i) => { if (!c.used) av.push({ id: Object.keys(allCoupons[currentWeekKey])[i], ...c }); }); av.sort((a,b) => b.amount - a.amount);
            let s3 = 0, fs = 0; let matched = []; let html = "";
            for (let item of av) { if (s3 + (item.amount * 3) <= bill) { s3 += (item.amount * 3); fs += item.amount; matched.push(item); html += `<div class="flex justify-between"><span>${item.member}(${item.payment})</span><span class="font-bold">${item.amount}</span></div>`; } }
            document.getElementById('smartPlanList').innerHTML = html || '無匹配'; document.getElementById('predictPay').innerText = (bill - fs).toFixed(1); window.tempMatched = matched;
        }
        function applySmartRedeem() {
            const bill = parseFloat(document.getElementById('billAmount').value); if (!window.tempMatched || !window.tempMatched.length) return;
            const tf = window.tempMatched.reduce((a,b)=>a+b.amount, 0); const tr = bill - tf;
            window.tempMatched.forEach(item => { db.ref(`coupons/${currentWeekKey}/${item.id}`).update({ used: true, billAmount: bill, realPayPart: (item.amount/tf)*tr }); });
            toggleCalc(false); document.getElementById('billAmount').value = '';
        }
        // 刪除功能函數
        function deleteCoupon(id) {
            if (confirm('確定要永久刪除這張優惠券嗎？此操作無法撤回。')) {
                db.ref(`coupons/${currentWeekKey}/${id}`).remove()
                    .then(() => {
                        // 可選：加入一個簡單的提示
                        console.log("刪除成功");
                    })
                    .catch((error) => {
                        alert("刪除失敗: " + error.message);
                    });
            }
        }
        db.ref('coupons').on('value', s => { allCoupons = s.val() || {}; updateSummaryTable(); updateStatsUI(); });
        window.onload = () => {
            const drp = document.getElementById('weekDropdown'); WEEK_DATA.forEach(w => { const opt = document.createElement('option'); opt.value = w.key; opt.textContent = `2026 第 ${w.id} 週 (${w.range})`; drp.appendChild(opt); });
            updateSlotUI();
        };
    </script>
</body>
</html>
